<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>cinescope</title>
  </head>
  <body>
   <header>
    <div class="logo">
      <span>🎬</span>
      <h1>cinescope</h1>
    </div>
  <div class="search-box">
    <input
        type="text"
        id="searchInput"
        placeholder="Search movies...">
    <button id="searchBtn">
        Search
    </button>
</div>
    <div class="feature-buttons">
    <a href="watchlater.html" class="feature-btn">
        ❤️ Watch Later
    </a>
    <button id="surpriseBtn" class="feature-btn">
        🎲 Surprise Me
    </button>
    <button id="hiddenGemBtn" class="feature-btn">
        💎 Hidden Gems
    </button>
    <select id="runtimeFilter">
        <option value="">⏱ Runtime Filter</option>
        <option value="short">Less than 90 min</option>
        <option value="medium">90 - 120 min</option>
        <option value="long">More than 120 min</option>
    </select>
</div>
  </header>
   <main>
    <div class="mood-container">
      <h2 class="mood-heading">😊 How are you feeling today?</h2>
<p class="mood-subtitle">
    Choose a mood and we'll recommend movies you'll enjoy.
</p>
       <button class="mood-btn" data-mood="happy">😊 Happy</button>
    <button class="mood-btn" data-mood="romantic">❤️ Romantic</button>
    <button class="mood-btn" data-mood="thrilling">😱 Thrilling</button>
    <button class="mood-btn" data-mood="sad">😢 Sad</button>
    <button class="mood-btn" data-mood="adventure">🤩 Adventure</button>
    </div>
    <h2>🔥 Trending Movies </h2>
    <div class="movie-grid" id="movieGrid"></div>
   </main>
   <div id="movieModal" class="modal hidden">
    <div class="modal-content">
      <span id="closeModal">&times;</span>
      <div id ="modalBody"></div>
    </div>
   </div>
   <script src="js/api.js">
   </script>
  </body>
</html>
