<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>cinescope</title>
  </head>
  <body>
   <header>
    <div class="logo">
      <span>🎬</span>
      <h1>cinescope</h1>
    </div>
    <input type="text" id="searchInput" placeholder="Search movies...">
    <button id="searchBtn">Search</button>
    <a href="watchlater.html">❤️ Watch Later</a>
    <div class="buttons">
    <button id="surpriseBtn">🎲 surprise Me </button>
    <button id="hiddenGemBtn">💎 Hidden Gems</button> 
    </div>
    <select id="runtimeFilter">
    <option value="">⏱ Runtime Filter</option>
    <option value="short">Less than 90 min</option>
    <option value="medium">90 - 120 min</option>
    <option value="long">More than 120 min</option>
</select>
  </header>
   <main>
    <h2>🔥 Trending Movies </h2>
    <div class="movie-grid" id="movieGrid"></div>
   </main>
   <div id="movieModal" class="modal hidden">
    <div class="modal-content">
      <span id="closeModal">&times;</span>
      <div id ="modalBody"></div>
    </div>
   </div>
   <script src="js/api.js">
   </script>
  </body>
</html>
